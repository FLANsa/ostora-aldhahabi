<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>طباعة باركود الإكسسوار — أسطورة الذهبي</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/mobile.css">

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <!-- Firebase so we can read the accessory back -->
  <script type="module" src="js/firebase-config-cdn.js?v=20260619-label-layout"></script>
  <script type="module" src="js/firebase-database-cdn.js?v=20260619-label-layout"></script>
  <script type="module" src="js/firebase-storage-manager.js?v=20260619-label-layout"></script>

  <style>
    :root { --card-bg:#fff; --muted:#cfcfcf; }
    body { font-family:'Cairo',sans-serif; background:#f8f9fa; margin:0; padding:24px; }
    .container { max-width:900px; margin:0 auto; }
    .card { background:var(--card-bg); border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,.05); }
    .card-header { padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between; }
    .card-header h3 { margin:0; font-size:1.1rem; font-weight:700; }
    .card-body { padding:20px; }
    .sticker-preview{ border:2px dashed var(--muted); padding:20px; background:#f9f9f9; border-radius:10px; display:flex; justify-content:center; margin-bottom:18px; }
    .sticker{ width:4cm; height:2.5cm; background:#fff; border:0; box-sizing:border-box; display:flex; flex-direction:column; align-items:stretch; padding:0.8mm 1.8mm 0.75mm; gap:0.28mm; overflow:hidden; direction:ltr; }
    .shop{ color:#000; text-align:center; font-weight:900; font-size:3.85mm; line-height:1.12; direction:rtl; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rows{ display:grid; grid-template-columns:1fr; gap:0.5mm; align-items:end; direction:ltr; }
    .row2{ display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; line-height:1; direction:rtl; }
    .value{ color:#000; font-weight:900; font-size:3.15mm; line-height:0.95; text-align:center; direction:rtl; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .sticker-barcode{ height:9mm; margin-block:2.5mm; display:flex; align-items:center; justify-content:center; }
    .sticker-barcode canvas{ width:100%; height:9mm !important; image-rendering:crisp-edges; image-rendering:pixelated; display:block; }
    .code-warning{ color:#9a6700; background:#fff8e1; border:1px solid #f0d68a; border-radius:8px; padding:8px 12px; margin-top:12px; font-size:.85rem; }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{ appearance:none; border:0; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; font-family:inherit; }
    .btn-primary{ background:#10b981; color:#fff; }
    .btn-outline{ background:#fff; color:#111; border:1px solid #e5e7eb; }
    .btn i{ margin-left:8px; }
    @page{ size:auto; margin:5mm; }
    @media print{ .no-print{ display:none !important; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h3>طباعة باركود الإكسسوار</h3>
        <div class="actions no-print">
          <button id="btnDownloadPDF" class="btn btn-primary">تحميل PDF <i class="fa fa-download"></i></button>
          <button id="btnPrintPDF" class="btn btn-outline">طباعة PDF <i class="fa fa-print"></i></button>
          <a href="dashboard.html" class="btn btn-outline">العودة للوحة التحكم</a>
        </div>
      </div>
      <div class="card-body">
        <div class="sticker-preview">
          <div id="sticker" class="sticker">
            <div class="shop">أسطورة الذهبي</div>
            <div class="sticker-barcode"><canvas id="barcode-canvas"></canvas></div>
            <div class="rows">
              <div class="row2"><div class="value" id="selling-price">جاري التحميل...</div></div>
            </div>
          </div><!-- /sticker -->
        </div><!-- /preview -->
        <div id="code-warning" class="code-warning no-print" style="display:none;"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  // Sticker output size - نفس مقاس ملصق الجوال
  const STICKER_MM = { w:40, h:25 }, DPI = 300, PX_PER_MM = DPI/25.4;
  const TARGET_W = Math.round(STICKER_MM.w * PX_PER_MM);
  const TARGET_H = Math.round(STICKER_MM.h * PX_PER_MM);

  const stickerEl = document.getElementById('sticker');
  const btnDownload = document.getElementById('btnDownloadPDF');
  const btnPrint = document.getElementById('btnPrintPDF');

  function showWarning(text){
    const warning = document.getElementById('code-warning');
    if(!warning) return;
    warning.textContent = text || '';
    warning.style.display = text ? 'block' : 'none';
  }

  function generateBarcode(code){
    const canvas = document.getElementById('barcode-canvas');
    if(!canvas || !window.JsBarcode) return;
    const value = String(code||'').trim();
    if(!value) return;
    const normalized = window.accessoryCode ? window.accessoryCode.normalize(value) : value.replace(/[^A-Za-z0-9]/g,'');
    canvas.dataset.barcodeValue = value;
    // نفس إعدادات ملصق الهاتف، مع تقليل عرض الشريط للأكواد القديمة الطويلة فقط
    try{
      JsBarcode(canvas, value, {
        format:"CODE128",
        width: normalized.length > 8 ? 1.05 : 2.05,
        height:36,
        displayValue:false,
        margin:0,
        background:"#ffffff",
        lineColor:"#000000"
      });
      showWarning(normalized.length > 8
        ? 'هذا باركود مرجعي قديم وطويل؛ يُطبع بمسافة شرائط أضيق. استخدم المعرّف القصير ACCXXXXX للأكسسوارات الجديدة.'
        : '');
    }catch(error){
      console.warn('تعذّر ترميز الباركود:', error);
      showWarning('تعذّر ترميز هذا الرقم على الملصق؛ استخدم معرّفاً لاتينياً أو المعرّف القصير ACCXXXXX.');
    }
  }

  async function captureStickerCanvas(){
    const scaleX = TARGET_W / stickerEl.clientWidth;
    const scaleY = TARGET_H / stickerEl.clientHeight;
    const scale = Math.min(scaleX, scaleY);
    return await html2canvas(stickerEl, {
      backgroundColor:'#ffffff',
      scale,
      useCORS:true,
      logging:false,
      x:0, y:0,
      width: stickerEl.clientWidth,
      height: stickerEl.clientHeight
    });
  }

  async function downloadPdf(){
    const canvas = await captureStickerCanvas();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:[STICKER_MM.w, STICKER_MM.h] });
    doc.addImage(imgData, 'PNG', 0, 0, STICKER_MM.w, STICKER_MM.h, undefined, 'FAST');
    doc.save(`barcode_${String(currentBarcode || 'accessory').replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
  }

  async function printPdf(){
    const canvas = await captureStickerCanvas();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:[STICKER_MM.w, STICKER_MM.h] });
    doc.addImage(imgData, 'PNG', 0, 0, STICKER_MM.w, STICKER_MM.h, undefined, 'FAST');
    const blobUrl = doc.output('bloburl');
    const win = window.open(blobUrl);
    if(!win){ alert('يرجى السماح بفتح النوافذ المنبثقة للطباعة.'); return; }
    const onLoad = ()=>{ win.focus(); win.print(); };
    if(win.document.readyState==='complete'){ onLoad(); } else { win.onload = onLoad; }
  }

  function valuesFromAccessory(accessory){
    const price = accessory?.selling_price || 0;
    return { priceText: price ? `${price} ريال` : '-' };
  }

  function fillSticker({priceText}, scannable){
    document.getElementById('selling-price').textContent = priceText || '-';
    generateBarcode(scannable || currentBarcode || '-');
  }

  async function findAccessoryByBarcode(barcode){
    if(!barcode) return null;

    // المطابقة تشمل المعرّف القصير والباركود المرجعي القديم وكل المعرّفات الأخرى
    const matches = item => window.accessoryCode
      ? window.accessoryCode.matches(item, barcode)
      : String(item?.barcode)===String(barcode) || String(item?.barcode_id)===String(barcode);

    // 1) Fast handoff from add page
    try{
      const last = JSON.parse(localStorage.getItem('lastAddedAccessory')||'null');
      if(last && matches(last)) return last;
    }catch{}

    // 2) Firebase or localStorage through the storage manager
    try{
      if(window.storage){
        if(typeof window.storage.getAccessoryByBarcode === 'function'){
          const one = await window.storage.getAccessoryByBarcode(String(barcode));
          if(one) return one;
        }
        const all = await window.storage.getAccessories();
        const list = Array.isArray(all) ? all : Object.values(all||{});
        const found = list.find(matches);
        if(found) return found;
      }
    }catch(e){ console.warn('Firebase lookup failed:', e); }

    // 3) LocalStorage fallback
    try{
      const arr = JSON.parse(localStorage.getItem('accessories')||'[]');
      if(Array.isArray(arr)){
        const found = arr.find(matches);
        if(found) return found;
      }
    }catch{}

    return null;
  }

  let currentBarcode = '';

  function scannableFor(accessory, fallback){
    if(window.accessoryCode){
      return window.accessoryCode.scannableId(accessory) || fallback || '';
    }
    return accessory?.barcode_id || accessory?.barcode || fallback || '';
  }

  async function loadAccessoryData(){
    // allow Firebase modules to initialize
    await new Promise(r => setTimeout(r, 300));

    const urlParams = new URLSearchParams(window.location.search);
    const barcode = urlParams.get('barcode');

    if(barcode){
      const accessory = await findAccessoryByBarcode(barcode);
      if(accessory){
        currentBarcode = scannableFor(accessory, barcode);
        fillSticker(valuesFromAccessory(accessory), currentBarcode);
      }else{
        // إذا لم يُعثر على السجل، نطبع ذات الرقم المُمرَّر مع تنبيه واضح
        currentBarcode = barcode;
        fillSticker({ priceText: '-' }, barcode);
        alert('لم يتم العثور على بيانات الإكسسوار في القاعدة، تم استخدام الباركود فقط.');
      }
      return;
    }

    // No ?barcode= : try lastAddedAccessory directly (user came here manually after adding)
    try{
      const last = JSON.parse(localStorage.getItem('lastAddedAccessory')||'null');
      if(last){
        currentBarcode = scannableFor(last, last.barcode);
        fillSticker(valuesFromAccessory(last), currentBarcode);
        return;
      }
    }catch{}

    // لا نولّد رقماً قديماً طويلاً غير محفوظ؛ نستخدم معرّفاً قصيراً مع تنبيه
    currentBarcode = window.accessoryCode ? window.accessoryCode.shortId(Date.now()) : 'ACC-0000';
    fillSticker({ priceText: '0 ريال' }, currentBarcode);
    showWarning('هذا ملصق تجريبي غير مرتبط بسجل محفوظ؛ أضف الإكسسوار أولاً ثم اطبع باركوده.');
  }

  document.addEventListener('DOMContentLoaded', loadAccessoryData);
  btnDownload?.addEventListener('click', (e)=>{ e.preventDefault(); downloadPdf(); });
  btnPrint?.addEventListener('click', (e)=>{ e.preventDefault(); printPdf(); });
})();
</script>
</body>
</html>
